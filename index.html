<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>應用文小高手遊戲</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --vermilion:#c0392b; --vermilion-dark:#a93226;
      --vermilion-glow:rgba(192,57,43,0.35);
      --jade:#1a7a4a; --gold:#c9952a;
      --ink:#1a1208; --ink-soft:#3d2c1e;
      --parchment:#fdf6e3; --parchment-mid:#f5e6c8;
      --warm-border:rgba(210,180,140,0.45);
    }
    *,*::before,*::after{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Noto Serif TC','PingFang TC','Heiti TC','Microsoft JhengHei',serif;
      -webkit-tap-highlight-color:transparent;
      background:linear-gradient(160deg,var(--parchment) 0%,var(--parchment-mid) 100%);
      min-height:100vh;
    }
    @keyframes fadeInUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
    @keyframes zoomIn{from{opacity:0;transform:scale(0.93)}to{opacity:1;transform:scale(1)}}
    @keyframes inkDrop{0%{opacity:0;transform:scale(0.5) rotate(-6deg)}65%{opacity:1;transform:scale(1.06) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
    @keyframes floatBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes orbitPulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.06)}}
    @keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}85%{opacity:1}100%{transform:translateY(105vh) rotate(780deg);opacity:0}}
    @keyframes heartPop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
    @keyframes glowRing{0%,100%{box-shadow:0 0 0 0 var(--vermilion-glow)}50%{box-shadow:0 0 0 10px rgba(192,57,43,0)}}
    @keyframes shimmerSlide{0%{background-position:-200% center}100%{background-position:200% center}}
    @keyframes bubbleIn{0%{opacity:0;transform:scale(0.8) translateY(8px)}100%{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes chatSlide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}

    .anim-fade-up{animation:fadeInUp .55s cubic-bezier(.16,1,.3,1) both}
    .anim-zoom-in{animation:zoomIn .38s cubic-bezier(.34,1.56,.64,1) both}
    .anim-ink-drop{animation:inkDrop .48s cubic-bezier(.34,1.56,.64,1) both}
    .anim-float{animation:floatBob 3.6s ease-in-out infinite}
    .anim-heart-pop{animation:heartPop .42s cubic-bezier(.34,1.56,.64,1) both}
    .anim-glow-ring{animation:glowRing 2.2s ease-in-out infinite}
    .anim-bubble{animation:bubbleIn .4s cubic-bezier(.34,1.56,.64,1) both}
    .anim-chat{animation:chatSlide .35s ease both}

    .bokeh-orb{position:absolute;border-radius:50%;pointer-events:none;animation:orbitPulse ease-in-out infinite}

    .opt-btn{
      width:100%;text-align:left;padding:12px 14px;
      border-radius:12px;border:1.8px solid #e6d8c5;
      background:#fffdf9;cursor:pointer;
      font-family:inherit;font-size:.9rem;font-weight:500;color:var(--ink-soft);
      display:flex;align-items:center;gap:10px;
      transition:all .18s ease;
      box-shadow:0 2px 6px rgba(0,0,0,.04);
      position:relative;overflow:hidden;
    }
    .opt-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;background:transparent;transition:background .18s}
    .opt-btn:hover:not(:disabled){border-color:var(--vermilion);background:#fff8f7;transform:translateX(5px);box-shadow:4px 4px 14px rgba(192,57,43,.1)}
    .opt-btn:hover:not(:disabled)::before{background:var(--vermilion)}
    .opt-btn:disabled{cursor:default}
    .opt-btn.is-correct{border-color:#16a34a;background:#f0fdf4;color:#15803d}
    .opt-btn.is-correct::before{background:#16a34a}
    .opt-btn.is-wrong-ans{border-color:#22c55e;background:#f0fdf4;color:#15803d;opacity:.75}
    .opt-btn.is-wrong-ans::before{background:#22c55e}
    .opt-btn.is-wrong{border-color:#fca5a5;background:#fff5f5;color:#b91c1c;opacity:.45}
    .opt-btn.is-wrong::before{background:#fca5a5}
    .opt-label{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:8px;background:#f0e8dc;color:#7a5c3a;font-size:.78rem;font-weight:800;flex-shrink:0;transition:all .18s}
    .opt-btn:hover:not(:disabled) .opt-label{background:rgba(192,57,43,.12);color:var(--vermilion)}
    .opt-btn.is-correct .opt-label{background:#dcfce7;color:#15803d}
    .opt-btn.is-wrong .opt-label{background:#fee2e2;color:#b91c1c}

    .heart-bar{display:inline-flex;align-items:center;gap:5px;background:rgba(255,251,245,.93);backdrop-filter:blur(14px);border:1.5px solid var(--warm-border);border-radius:50px;padding:6px 14px;box-shadow:0 4px 20px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.8)}

    /* Speech bubbles */
    .speech-left{
      background:rgba(255,253,249,.96);backdrop-filter:blur(16px);
      border:1.5px solid rgba(230,215,190,.65);border-radius:18px 18px 18px 4px;
      padding:12px 16px;
      box-shadow:0 8px 28px rgba(0,0,0,.09),0 2px 6px rgba(0,0,0,.05);
    }
    .speech-right{
      background:rgba(255,253,249,.96);backdrop-filter:blur(16px);
      border:1.5px solid rgba(230,215,190,.65);border-radius:18px 18px 4px 18px;
      padding:12px 16px;text-align:right;
      box-shadow:0 8px 28px rgba(0,0,0,.09),0 2px 6px rgba(0,0,0,.05);
    }
    .speech-chat{
      background:rgba(255,253,249,.97);backdrop-filter:blur(18px);
      border:1.5px solid rgba(230,215,190,.7);border-radius:16px;
      padding:14px 18px;
      box-shadow:0 6px 24px rgba(0,0,0,.08);
    }

    .prog-track{height:5px;background:rgba(210,180,140,.35);border-radius:99px;overflow:hidden}
    .prog-fill{height:100%;background:linear-gradient(90deg,var(--vermilion),#e74c3c);border-radius:99px;transition:width .5s cubic-bezier(.34,1,.64,1)}

    .map-popup{background:rgba(255,253,249,.97);backdrop-filter:blur(20px);border:1.5px solid rgba(192,57,43,.22);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.16),0 6px 20px rgba(192,57,43,.08)}

    .dpad-btn{background:rgba(255,255,255,.92);border:none;border-radius:11px;width:46px;height:46px;box-shadow:0 4px 0 rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.09);cursor:pointer;transition:all .1s;display:flex;align-items:center;justify-content:center;font-size:1.1rem;backdrop-filter:blur(8px)}
    .dpad-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}

    .confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .confetti-piece{position:absolute;top:-14px;border-radius:3px;animation:confettiFall linear forwards}

    .shimmer-text{background:linear-gradient(90deg,#c0392b,#e67e22,#c9952a,#c0392b);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmerSlide 2.8s linear infinite}

    .btn-vermilion{background:linear-gradient(135deg,var(--vermilion) 0%,var(--vermilion-dark) 100%);color:#fff;border:none;border-radius:14px;padding:13px 20px;cursor:pointer;font-family:inherit;font-weight:700;font-size:.95rem;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 6px 20px var(--vermilion-glow),inset 0 1px 0 rgba(255,255,255,.15);transition:all .2s ease}
    .btn-vermilion:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(192,57,43,.45)}
    .btn-vermilion:active{transform:translateY(0)}

    .card-shadow{box-shadow:0 24px 80px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.06)}

    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#d4b896;border-radius:99px}

    /* Chat bubble tail helpers */
    /* ══ 響應式 ══ */
    @media (max-width: 860px) {
      .playing-wrap { flex-direction: column !important; min-height:unset !important; }
      .playing-left { flex: none !important; width: 100% !important; min-height: 360px !important; }
      .playing-right{ flex: none !important; width: 100% !important; border-left: none !important; border-top: 1px solid rgba(230,215,190,.5); }
    }
    @media (orientation: landscape) and (max-height: 520px) {
      .playing-wrap { min-height: 96vh !important; }
      .playing-left { min-height: 96vh !important; }
      .map-full { min-height: 96vh !important; border-radius: 0 !important; }
    }

    .challenge-panel{background:linear-gradient(160deg,#fffdf9 0%,#fdf4e7 100%);border-left:1px solid rgba(230,215,190,.55)}
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ── SVG 圖示 ── */
const Heart = ({ className, filled, style }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
    fill={filled?"currentColor":"none"} stroke="currentColor" strokeWidth="2"
    strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
  </svg>
);
const Trophy = ({ className, style }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
    <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
    <path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
    <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
  </svg>
);
const ArrowRight = ({ className, style }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
    <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
  </svg>
);
const Play = ({ className, style }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none" className={className} style={style}>
    <polygon points="6 3 20 12 6 21 6 3"/>
  </svg>
);
const BookOpen = ({ className, style }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
  </svg>
);
const AlertCircle = ({ className, style }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
    <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
  </svg>
);
const CheckCircle2 = ({ className, style }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
    <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
  </svg>
);
const MessageCircle = ({ style }) => (
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
    <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
  </svg>
);

/* ── 勝利紙花 ── */
const Confetti = () => {
  const colors = ['#c0392b','#e67e22','#f1c40f','#27ae60','#2980b9','#8e44ad','#e91e63','#1abc9c'];
  const pieces = useMemo(() => Array.from({length:80},(_,i)=>({
    id:i, color:colors[i%colors.length],
    left:`${Math.random()*100}%`,
    width:`${5+Math.random()*9}px`, height:`${9+Math.random()*13}px`,
    delay:`${Math.random()*2.4}s`, duration:`${2.4+Math.random()*2}s`,
    round:Math.random()>.5,
  })),[]);
  return (
    <div className="confetti-wrap">
      {pieces.map(p=>(
        <div key={p.id} className="confetti-piece" style={{left:p.left,width:p.width,height:p.height,background:p.color,animationDelay:p.delay,animationDuration:p.duration,borderRadius:p.round?'50%':'3px'}}/>
      ))}
    </div>
  );
};

/* ── 場景聊天資料 ── */
const chatData = {
  home: [
    { charIdx:0, messages:[
      '你今天表現超棒！媽媽跟你說，以後留便條給家人，記得寫清楚時間、事情，署名後面寫「留」就好——千萬不能寫「敬啟」喔！',
      '對了，媽媽上次幫外婆寫生日卡片，不知道怎麼問安，你能告訴我嗎？沒錯，就是「叩請 金安」，因為外婆是長輩！',
      '謝謝你幫媽媽複習了這麼多。媽媽以後寫信，一定請你當小顧問！你是媽媽的驕傲喔！'
    ]},
    { charIdx:1, messages:[
      '哈哈，爸爸年輕的時候，也曾把提稱語搞錯，把寫給老師的信用了平輩的「大鑒」，被老師退信了，真是囧！',
      '應用文說穿了就是禮貌的藝術——對父母用「膝下」，對老師用「函丈」，對朋友用「台鑒」，看對象調整！',
      '加油！等你把六關都過了，爸爸請你吃大餐！不過你現在就已經讓爸爸刮目相看了，真的！'
    ]},
  ],
  playground: [
    { charIdx:0, messages:[
      '你剛才好厲害！我本來以為對同學可以用任何提稱語，原來只能用「大鑒」或「台鑒」！我趕快記在腦子裡！',
      '對了，我最近要幫班上寫失物招領公告，你說這算不算「啟事」？對啊！就是啟事，就是向大家公開說明一件事！',
      '謝謝你今天陪我練習！你不只應用文好，人也好！我們以後一起讀書，互相考對方，好不好？'
    ]},
  ],
  classroom: [
    { charIdx:0, messages:[
      '你表現得非常好！老師想問你，如果你要寫信給我表達感謝，信封上應該用什麼啟封詞？答對了，就是「道啟」，這是對老師專用的！',
      '對老師自稱要用「受業」或「學生」——這不只是規定，更是對知識傳授的感謝與尊重。你理解這個精神了嗎？',
      '老師很開心你學得這麼認真！以後把這些知識分享給同學吧，教別人是最好的學習方式！'
    ]},
  ],
  countryside: [
    { charIdx:0, messages:[
      '嗯！乖孫！以前你爸爸從外地寄來的信，每封都工工整整、客客氣氣，讓爺爺看了好高興。現在你也學會了，真不錯！',
      '壽帖題辭也很講究——男性長輩用「松柏長青」，女性長輩用「萱草長春」。這是中華文化的智慧，要好好保留！',
      '謝謝你今天陪爺爺過生日，還學了這麼多應用文！等下我們一起吃長壽麵，再讓你帶幾樣點心回去！'
    ]},
    { charIdx:1, messages:[
      '哎呀，乖孫回答得這麼好，奶奶臉上有光啊！奶奶年輕的時候，收到鄰居的信都是很正式的格式，現在想想好溫馨！',
      '你剛才說的「萱草長春」，奶奶聽了好感動喔！原來是代表媽媽的意思，以後你也要在媽媽生日送她這樣的祝福！',
      '好了，點心準備好了！等你把所有關卡都通過，奶奶親手做你最愛的蘿蔔糕當獎勵！你是奶奶最疼愛的寶貝！'
    ]},
  ],
  mall: [
    { charIdx:0, messages:[
      '你真是個應用文小高手！我昨天收到一封合作邀請信，對方的提稱語寫「台鑒」，你說對嗎？對！因為我們是平輩關係！',
      '做生意的人，一封信就是一張臉。用詞正確，人家才覺得你專業可靠。這道理你現在就懂，以後一定大有出息！',

      '對了，我想邀請同學來參加才藝發表會，你說這算不算柬帖？對！就是柬帖！要寫清楚時間、地點、邀請的目的！',
      '謝謝你今天陪我爬後山，還教了我好多！等我長大，我也要像你一樣把應用文學得好好的，然後教自己的小孩！'

/* ── 場景題庫資料 ── */
const scenesData = [
  {
    id:'home', title:'溫暖的家',
    mapX:20, mapY:30,
    bg:'from-amber-100 via-orange-50 to-amber-200',
    bgImage:'home.png', icon:'🏠', accent:'#c0392b',
    description:'早晨準備出門，遇到家人與留便條紙的情境...',

      { q:'信封中路寫給父親，下列格式何者完全正確？', options:['某某 父親 安啟','某某 先生 安啟','某某 先生 敬啟'], answer:1, hint:'信封中路不能寫「父親」，要用一般稱呼「先生」；啟封詞給長輩用「安啟」，不能用「敬啟」。' },

/* ══ 主元件 ══ */
function App() {
  const [gameState, setGameState]           = useState('pre-video');
  const [currentSceneIndex, setCurrentSceneIndex] = useState(0);
  const [hearts, setHearts]                 = useState([false,false,false,false,false,false]);
  const [playerPos, setPlayerPos]           = useState({ x:35, y:50 });
  const [nearbyScene, setNearbyScene]       = useState(null);
  const [isChallenging, setIsChallenging]   = useState(false);
  const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
  const [feedback, setFeedback]             = useState(null);

  const [wrongCount, setWrongCount]         = useState(0);

  /* chat states */
  const [isChatting, setIsChatting]         = useState(false);
  const [chatCharIdx, setChatCharIdx]       = useState(0);
  const [chatMsgIdx, setChatMsgIdx]         = useState(0);

  const bgmRef          = useRef(null);
  const correctSoundRef = useRef(null);
  const wrongSoundRef   = useRef(null);
  const keysRef         = useRef({ ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false });
  const requestRef      = useRef();

  /* ── Web Audio 音效合成 ── */
  function playBeep(type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (type === 'correct') {
        // 三音上升叮
        [523, 659, 784].forEach((freq, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0, ctx.currentTime + i*0.12);
          g.gain.linearRampToValueAtTime(0.22, ctx.currentTime + i*0.12 + 0.04);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.12 + 0.22);
          o.start(ctx.currentTime + i*0.12);
          o.stop(ctx.currentTime + i*0.12 + 0.25);
        });
      } else if (type === 'wrong') {
        // 兩音下降嗡
        [300, 220].forEach((freq, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sawtooth';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.18, ctx.currentTime + i*0.18);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.18 + 0.28);
          o.start(ctx.currentTime + i*0.18);
          o.stop(ctx.currentTime + i*0.18 + 0.3);
        });
      } else if (type === 'fireworks') {
        // 煙火爆炸聲串
        [0, 0.35, 0.68, 1.05, 1.4].forEach(delay => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          const nGain = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sawtooth';
          o.frequency.setValueAtTime(600 + Math.random()*300, ctx.currentTime + delay);
          o.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + delay + 0.4);
          g.gain.setValueAtTime(0.3, ctx.currentTime + delay);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.45);
          o.start(ctx.currentTime + delay);
          o.stop(ctx.currentTime + delay + 0.5);
          // 雜音爆裂
          const buf = ctx.createBuffer(1, ctx.sampleRate * 0.15, ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let k=0; k<data.length; k++) data[k] = Math.random()*2-1;
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(nGain); nGain.connect(ctx.destination);
          nGain.gain.setValueAtTime(0.25, ctx.currentTime + delay);
          nGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.18);
          src.start(ctx.currentTime + delay);
        });
      }
    } catch(e) {}
  }

  useEffect(() => {
    bgmRef.current = new Audio('校園午後散步.mp3');
    bgmRef.current.loop = true;
    correctSoundRef.current = new Audio('correct.mp3');
    wrongSoundRef.current   = new Audio('wrong.mp3');
  }, []);

  /* 嘗試播放 mp3，失敗則用 Web Audio 合成 */
  function playCorrect() {
    if (correctSoundRef.current) {
      correctSoundRef.current.currentTime = 0;
      correctSoundRef.current.play().catch(() => playBeep('correct'));
    } else { playBeep('correct'); }
  }
  function playWrong() {
    if (wrongSoundRef.current) {
      wrongSoundRef.current.currentTime = 0;
      wrongSoundRef.current.play().catch(() => playBeep('wrong'));
    } else { playBeep('wrong'); }
  }

  /* 鍵盤 */
  useEffect(() => {
    const dn=(e)=>{ if(e.key in keysRef.current){ keysRef.current[e.key]=true; if(gameState==='map')e.preventDefault(); }};
    const up=(e)=>{ if(e.key in keysRef.current){ keysRef.current[e.key]=false; if(gameState==='map')e.preventDefault(); }};
    window.addEventListener('keydown',dn); window.addEventListener('keyup',up);
    return ()=>{ window.removeEventListener('keydown',dn); window.removeEventListener('keyup',up); };
  }, [gameState]);

  /* 地圖移動迴圈 */
  useEffect(() => {
    if (gameState !== 'map') return;
    const tick = () => {
      setPlayerPos(prev => {
        let dx=0,dy=0; const sp=0.6;
        if(keysRef.current.ArrowUp)    dy-=sp;
        if(keysRef.current.ArrowDown)  dy+=sp;
        if(keysRef.current.ArrowLeft)  dx-=sp;
        if(keysRef.current.ArrowRight) dx+=sp;
        if(dx!==0||dy!==0){
          const nx=Math.max(3,Math.min(97,prev.x+dx));
          const ny=Math.max(3,Math.min(97,prev.y+dy));
          if(nx!==prev.x||ny!==prev.y) return {x:nx,y:ny};
        }
        return prev;
      });
      requestRef.current = requestAnimationFrame(tick);
    };
    requestRef.current = requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(requestRef.current);
  }, [gameState]);

  const handlePointerDown = (dir) => { keysRef.current[dir]=true; };
  const handlePointerUp   = (dir) => { keysRef.current[dir]=false; };

  /* 距離偵測 */
  useEffect(() => {
    if (gameState!=='map') return;
    let found=null;
    for(let i=0;i<scenesData.length;i++){
      const s=scenesData[i];
      if(Math.sqrt((playerPos.x-s.mapX)**2+(playerPos.y-s.mapY)**2)<10){ found=i; break; }
    }
    setNearbyScene(found);
  }, [playerPos, gameState]);

  /* 遊戲流程 */
  const goToPreVideo = () => {
    setGameState('pre-video');
    setHearts([false,false,false,false,false,false]);
    setCurrentSceneIndex(0);
    setWrongCount(0);
    if(bgmRef.current){ bgmRef.current.pause(); bgmRef.current.currentTime=0; }
  };
  const startGame = () => {
    setGameState('map');
    setPlayerPos({x:35,y:50});
    setCurrentSceneIndex(0);
    setHearts([false,false,false,false,false,false]);
    setWrongCount(0);
    if(bgmRef.current){ bgmRef.current.currentTime=0; bgmRef.current.play().catch(()=>{}); }
  };
  const enterScene = (i) => {
    setCurrentSceneIndex(i); setGameState('playing');
    setIsChallenging(false); setIsChatting(false); setChatMsgIdx(0); setChatCharIdx(0);
  };
  const returnToMap = () => {
    if(hearts.filter(Boolean).length===6){
      setGameState('victory');
      if(bgmRef.current) bgmRef.current.pause();
      setTimeout(()=>playBeep('fireworks'),300);
    } else {
      setGameState('map');
    }
  };
  const openChallenge = () => { setCurrentQuestionIndex(0); setFeedback(null); setIsChallenging(true); setIsChatting(false); };
  const exitChallenge = () => { setIsChallenging(false); setFeedback(null); setGameState('map'); };

  /* 開始聊天 */
  const startChat = (charIdx) => {
    setChatCharIdx(charIdx); setChatMsgIdx(0); setIsChatting(true); setIsChallenging(false);
  };
  const nextChatMsg = () => {
    const scId = scenesData[currentSceneIndex].id;
    const char = chatData[scId][chatCharIdx];
    if(chatMsgIdx < char.messages.length - 1) setChatMsgIdx(p=>p+1);
    else setIsChatting(false);
  };

  const handleAnswer = (optIdx) => {
    if(feedback!==null) return;
    const sc = scenesData[currentSceneIndex];
    const q  = sc.questions[currentQuestionIndex];
    if(optIdx===q.answer){
      setFeedback('correct'); playCorrect();
      setTimeout(()=>{
        if(currentQuestionIndex < sc.questions.length-1){
          setCurrentQuestionIndex(p=>p+1); setFeedback(null);
        } else {
          const nh=[...hearts]; nh[currentSceneIndex]=true;
          setHearts(nh); setIsChallenging(false); setFeedback(null);
        }
      },1300);
    } else {
      setFeedback('wrong'); playWrong();
      setWrongCount(p => p + 1);
      setTimeout(()=>setFeedback(null),2200);
    }
  };

  /* ── 共用元件 ── */
  const HeartDisplay = () => (
    <div className="heart-bar mx-auto w-max">
      {hearts.map((earned,i)=>(
        <div key={i} style={earned?{animation:`heartPop .42s cubic-bezier(.34,1.56,.64,1) both`,animationDelay:`${i*.06}s`}:{}}>
          <Heart className={`w-5 h-5 sm:w-6 sm:h-6 ${earned?'text-red-500':'text-gray-300'}`} filled={earned}/>
        </div>
      ))}
      <div style={{width:1,height:18,background:'rgba(210,180,140,.5)',margin:'0 3px'}}/>
      <span style={{fontSize:'.8rem',fontWeight:700,color:'#7a5c3a',letterSpacing:'.03em'}}>{hearts.filter(Boolean).length}/6</span>
    </div>
  );

  const scene  = scenesData[currentSceneIndex];
  const sceneQ = scene.questions[currentQuestionIndex];
  const scChatData = chatData[scene.id] || [];

  /* ══════════════════════════════════════ RENDER ══════════════════════════════════════ */
  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'12px 12px 36px',fontFamily:"'Noto Serif TC','PingFang TC','Microsoft JhengHei',serif"}}>

                <p style={{color:'#7a5c3a',fontSize:'.88rem',marginBottom:24,lineHeight:1.65}}>解開這裡的應用文題目，就能獲得愛心拼塊喔！</p>
                <button onClick={openChallenge} className="btn-vermilion" style={{width:'100%',padding:'13px'}}
                  onMouseEnter={e=>e.currentTarget.style.transform='translateY(-2px)'}
                  onMouseLeave={e=>e.currentTarget.style.transform='translateY(0)'}>
                  進入挑戰 <ArrowRight style={{width:17,height:17}}/>
                </button>
              </div>
            )}

            {/* 狀態二：挑戰中 */}
            {isChallenging && (
              <div className="anim-fade-up" style={{display:'flex',flexDirection:'column',height:'100%'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,paddingBottom:12,borderBottom:'1px solid rgba(210,180,140,.4)'}}>
                  <span style={{fontWeight:800,color:'#3d2c1e',fontSize:'.92rem',letterSpacing:'.04em'}}>📜 挑戰題庫</span>
                  <span style={{background:'linear-gradient(135deg,rgba(192,57,43,.1),rgba(192,57,43,.05))',border:'1px solid rgba(192,57,43,.22)',color:'#c0392b',padding:'3px 11px',borderRadius:50,fontSize:'.76rem',fontWeight:700}}>
                    {currentQuestionIndex+1} / {scene.questions.length}
                  </span>
                </div>
                <div className="prog-track" style={{marginBottom:15}}>
                  <div className="prog-fill" style={{width:`${(currentQuestionIndex/scene.questions.length)*100}%`}}/>
                </div>
                <h3 style={{fontSize:'.94rem',fontWeight:700,color:'#1a1208',lineHeight:1.72,marginBottom:15}}>{sceneQ.q}</h3>
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  {sceneQ.options.map((opt,idx)=>{
                    const isAns = idx===sceneQ.answer;
                    let cls='opt-btn';
                    if(feedback==='correct'&&isAns) cls+=' is-correct';
                    else if(feedback==='wrong'&&isAns) cls+=' is-wrong-ans';
                    else if(feedback==='wrong'&&!isAns) cls+=' is-wrong';
                    return (
                      <button key={idx} className={cls} onClick={()=>handleAnswer(idx)} disabled={feedback!==null}>
                        <span className="opt-label">{String.fromCharCode(65+idx)}</span>{opt}
                      </button>
                    );
                  })}
                </div>
                <div style={{minHeight:80,marginTop:13}}>
                  {feedback==='correct' && (
                    <div className="anim-ink-drop" style={{padding:'12px 14px',borderRadius:12,background:'linear-gradient(135deg,#f0fdf4,#dcfce7)',border:'1.5px solid #86efac',display:'flex',alignItems:'center',gap:8,color:'#15803d'}}>
                      <CheckCircle2 style={{width:20,height:20,flexShrink:0}}/><span style={{fontWeight:700,fontSize:'.9rem'}}>答對了！太厲害了！🎉</span>
                    </div>
                  )}
                  {feedback==='wrong' && (
                    <div className="anim-ink-drop" style={{padding:'12px 14px',borderRadius:12,background:'linear-gradient(135deg,#fff5f5,#fee2e2)',border:'1.5px solid #fca5a5',color:'#b91c1c'}}>
                      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                        <AlertCircle style={{width:20,height:20,flexShrink:0}}/><span style={{fontWeight:700,fontSize:'.87rem'}}>哎呀，答錯囉！再試一次。</span>
                      </div>
                      <p style={{fontSize:'.79rem',margin:0,color:'#7f1d1d',lineHeight:1.58}}>💡 提示：{sceneQ.hint}</p>
                    </div>
                  )}
                </div>
                <div style={{marginTop:'auto',paddingTop:14,borderTop:'1px solid rgba(210,180,140,.38)',textAlign:'center'}}>
                  <button onClick={exitChallenge}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor='#c0392b';e.currentTarget.style.color='#c0392b'}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(210,180,140,.5)';e.currentTarget.style.color='#9a7a5a'}}
                    style={{background:'none',border:'1px solid rgba(210,180,140,.5)',color:'#9a7a5a',padding:'7px 20px',borderRadius:10,cursor:'pointer',fontFamily:"'Noto Serif TC',serif",fontSize:'.82rem',fontWeight:600,transition:'all .2s'}}>
                    退出關卡 · 返回大地圖
                  </button>
                </div>
              </div>
            )}

            {/* 狀態三：已完成（含聊天按鈕） */}
            {hearts[currentSceneIndex] && !isChallenging && !isChatting && (
              <div className="anim-fade-up" style={{textAlign:'center'}}>
                <div style={{display:'inline-flex',alignItems:'center',gap:8,background:'linear-gradient(135deg,#f0fdf4,#dcfce7)',border:'1.5px solid #86efac',borderRadius:50,padding:'9px 20px',marginBottom:18}}>
                  <CheckCircle2 style={{width:18,height:18,color:'#16a34a'}}/><span style={{fontWeight:700,color:'#15803d',fontSize:'.9rem'}}>場景解鎖！獲得愛心拼塊！</span>
                </div>
                <p style={{color:'#7a5c3a',fontSize:'.88rem',marginBottom:20,lineHeight:1.65}}>恭喜你完美解決了這裡的應用文難題！</p>
                
                {/* 聊天按鈕區 */}
                {scChatData.length > 0 && (
                  <div style={{marginBottom:20}}>
                    <p style={{color:'#9a7a5a',fontSize:'.78rem',marginBottom:10,letterSpacing:'.04em'}}>💬 與角色聊天</p>
                    <div style={{display:'flex',flexDirection:'column',gap:8}}>
                      {scChatData.map((chatChar,ci)=>{
                        const charName = scene.dialogues[chatChar.charIdx]?.name || '';
                        const charAvatar = scene.dialogues[chatChar.charIdx]?.avatar || '';
                        return (
                          <button key={ci} onClick={()=>startChat(ci)}
                            onMouseEnter={e=>e.currentTarget.style.transform='translateX(4px)'}
                            onMouseLeave={e=>e.currentTarget.style.transform='translateX(0)'}
                            style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',background:'rgba(250,243,228,.8)',border:'1.5px solid rgba(210,180,140,.5)',borderRadius:12,cursor:'pointer',fontFamily:"'Noto Serif TC',serif",transition:'all .18s',textAlign:'left'}}>
                            <img src={charAvatar} alt={charName} style={{width:36,height:36,objectFit:'contain',borderRadius:'50%',background:'rgba(255,253,249,1)',border:'1.5px solid rgba(210,180,140,.4)'}}/>
                            <div>
                              <div style={{fontSize:'.78rem',fontWeight:700,color:'#3d2c1e'}}>{charName}</div>
                              <div style={{fontSize:'.7rem',color:'#9a7a5a'}}>點擊開始聊天</div>
                            </div>
                            <MessageCircle style={{width:16,height:16,color:scene.accent,marginLeft:'auto'}}/>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                <button onClick={returnToMap}
                  onMouseEnter={e=>e.currentTarget.style.transform='translateY(-2px)'}
                  onMouseLeave={e=>e.currentTarget.style.transform='translateY(0)'}
                  style={{width:'100%',padding:'13px',background:'linear-gradient(135deg,#1e40af,#1d4ed8)',color:'white',border:'none',borderRadius:14,cursor:'pointer',fontFamily:"'Noto Serif TC',serif",fontWeight:700,fontSize:'.93rem',display:'flex',alignItems:'center',justifyContent:'center',gap:7,boxShadow:'0 6px 20px rgba(30,64,175,.3)',transition:'all .2s'}}>
                  返回大地圖 <ArrowRight style={{width:17,height:17}}/>
                </button>
              </div>
            )}

            {/* 狀態四：聊天中 */}
            {isChatting && scChatData[chatCharIdx] && (() => {
              const chatChar = scChatData[chatCharIdx];
              const charDlg  = scene.dialogues[chatChar.charIdx];
              const msg      = chatChar.messages[chatMsgIdx];
              const isLast   = chatMsgIdx >= chatChar.messages.length - 1;
              return (
                <div className="anim-fade-up" style={{display:'flex',flexDirection:'column',height:'100%'}}>
                  <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16,paddingBottom:12,borderBottom:'1px solid rgba(210,180,140,.4)'}}>
                    <img src={charDlg.avatar} alt={charDlg.name} style={{width:40,height:40,objectFit:'contain',borderRadius:'50%',background:'rgba(255,253,249,1)',border:`1.5px solid ${scene.accent}55`}}/>
                    <div>
                      <div style={{fontWeight:800,color:'#1a1208',fontSize:'.92rem'}}>{charDlg.name}</div>
                      <div style={{fontSize:'.7rem',color:'#9a7a5a'}}>聊天 {chatMsgIdx+1} / {chatChar.messages.length}</div>
                    </div>
                    <div style={{marginLeft:'auto',display:'flex',gap:4}}>
                      {chatChar.messages.map((_,i)=>(
                        <div key={i} style={{width:6,height:6,borderRadius:'50%',background:i<=chatMsgIdx?scene.accent:'rgba(210,180,140,.4)',transition:'all .3s'}}/>
                      ))}
                    </div>
                  </div>

                  <div className="speech-chat anim-chat" key={`chat-${chatMsgIdx}`} style={{marginBottom:20,flex:1}}>
                    <p style={{fontSize:'.92rem',color:'#3d2c1e',lineHeight:1.8,margin:0,fontWeight:500}}>{msg}</p>
                  </div>

                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    <button onClick={nextChatMsg}
                      onMouseEnter={e=>e.currentTarget.style.transform='translateY(-2px)'}
                      onMouseLeave={e=>e.currentTarget.style.transform='translateY(0)'}
                      style={{width:'100%',padding:'12px',background:`linear-gradient(135deg,${scene.accent},${scene.accent}cc)`,color:'white',border:'none',borderRadius:12,cursor:'pointer',fontFamily:"'Noto Serif TC',serif",fontWeight:700,fontSize:'.9rem',display:'flex',alignItems:'center',justifyContent:'center',gap:6,transition:'all .2s',boxShadow:`0 5px 18px ${scene.accent}44`}}>
                      {isLast?'結束聊天 👋':'繼續聊天 →'}
                    </button>
                    <button onClick={()=>setIsChatting(false)}
                      onMouseEnter={e=>{e.currentTarget.style.borderColor=scene.accent;e.currentTarget.style.color=scene.accent}}
                      onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(210,180,140,.5)';e.currentTarget.style.color='#9a7a5a'}}
                      style={{background:'none',border:'1px solid rgba(210,180,140,.5)',color:'#9a7a5a',padding:'8px',borderRadius:10,cursor:'pointer',fontFamily:"'Noto Serif TC',serif",fontSize:'.8rem',fontWeight:600,transition:'all .2s'}}>
                      返回場景
                    </button>
                  </div>
                </div>
              );
            })()}
          </div>
        </div>
      )}

      {/* ──────────── VICTORY ──────────── */}
      {gameState==='victory' && (() => {
        const rank =
          wrongCount === 0   ? { title:'應用文神人', sub:'完美無瑕，零失誤通關！', color1:'#8B0000', color2:'#c0392b', border:'#FFD700', glow:'rgba(255,215,0,.55)', badge:'🏆', stars:5 } :
          wrongCount <= 5    ? { title:'應用文小達人', sub:`僅答錯 ${wrongCount} 次，表現卓越！`, color1:'#7c3aed', color2:'#9333ea', border:'#c4b5fd', glow:'rgba(167,139,250,.45)', badge:'🥇', stars:4 } :
          wrongCount <= 10   ? { title:'應用文小學士', sub:`答錯 ${wrongCount} 次，根基紮實！`, color1:'#1e40af', color2:'#2563eb', border:'#93c5fd', glow:'rgba(147,197,253,.45)', badge:'🎓', stars:3 } :
          wrongCount <= 15   ? { title:'應用文小凡夫', sub:`答錯 ${wrongCount} 次，仍有進步空間。`, color1:'#065f46', color2:'#059669', border:'#6ee7b7', glow:'rgba(110,231,183,.4)', badge:'📖', stars:2 } :
                               { title:'應用文小白丁', sub:`答錯 ${wrongCount} 次，再接再厲！`, color1:'#7f1d1d', color2:'#b45309', border:'#fcd34d', glow:'rgba(252,211,77,.35)', badge:'📝', stars:1 };
        const stars = Array.from({length:5},(_,i) => i < rank.stars);
        return (
          <div style={{position:'fixed',inset:0,zIndex:60,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden'}}>
            <div style={{position:'absolute',inset:0,backgroundImage:"url('背景畫面2.png')",backgroundSize:'cover',backgroundPosition:'center'}}/>
            <div style={{position:'absolute',inset:0,background:'rgba(255,252,240,.5)'}}/>
            <Confetti/>
            <div className="anim-zoom-in" style={{position:'relative',zIndex:10,maxWidth:520,width:'92%',textAlign:'center'}}>

              {/* ── 匾額本體 ── */}
              <div style={{
                position:'relative',
                background:`linear-gradient(160deg,#fdf6e3 0%,#f5e6c8 45%,#fdf0d0 100%)`,
                borderRadius:18,
                border:`4px solid ${rank.border}`,
                boxShadow:`0 0 0 8px ${rank.color1}cc, 0 0 0 12px ${rank.border}88, 0 24px 60px rgba(0,0,0,.28), 0 0 80px ${rank.glow}`,
                padding:'36px 32px 30px',
                overflow:'hidden',
              }}>
                {/* 匾額內框線 */}
                <div style={{position:'absolute',inset:10,border:`1.5px solid ${rank.border}66`,borderRadius:10,pointerEvents:'none'}}/>
                {/* 四角花紋 */}
                {['top-3 left-3','top-3 right-3','bottom-3 left-3','bottom-3 right-3'].map((pos,i)=>(
                  <div key={i} style={{
                    position:'absolute',
                    top: i < 2 ? 10 : 'auto', bottom: i >= 2 ? 10 : 'auto',
                    left: i%2===0 ? 10 : 'auto', right: i%2===1 ? 10 : 'auto',
                    width:22,height:22,
                    background:`radial-gradient(circle, ${rank.border} 30%, transparent 70%)`,
                    borderRadius:'50%',opacity:.7,
                  }}/>
                ))}

                {/* 頂部彩帶 */}
                <div style={{height:5,background:`linear-gradient(90deg,${rank.color1},${rank.border},${rank.color2},${rank.border},${rank.color1})`,borderRadius:4,marginBottom:20,marginTop:-8,marginLeft:-8,marginRight:-8}}/>

                {/* 星星列 */}
                <div style={{display:'flex',justifyContent:'center',gap:6,marginBottom:14}}>
                  {stars.map((lit,i)=>(
                    <span key={i} className={lit?'anim-heart-pop':''} style={{
                      fontSize:'1.5rem',
                      filter: lit ? `drop-shadow(0 2px 6px ${rank.glow})` : 'grayscale(1) opacity(.3)',
                      animationDelay:`${i*.1}s`,
                    }}>⭐</span>
                  ))}
                </div>

                {/* 徽章 + 頭銜 */}
                <div style={{fontSize:'3.2rem',marginBottom:8,filter:`drop-shadow(0 4px 12px ${rank.glow})`}} className="anim-float">{rank.badge}</div>
                <h2 style={{
                  fontSize:'clamp(1.55rem,5vw,2.1rem)',fontWeight:900,
                  background:`linear-gradient(135deg,${rank.color1},${rank.color2})`,
                  WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',
                  backgroundClip:'text',
                  letterSpacing:'.08em',margin:'0 0 8px',
                  textShadow:'none',
                  filter:`drop-shadow(0 2px 4px ${rank.glow})`,
                }}>{rank.title}</h2>
                <p style={{color:'#5a4030',fontSize:'.92rem',lineHeight:1.6,margin:'0 0 16px',fontWeight:600}}>{rank.sub}</p>

                {/* 分隔線 */}
                <div style={{height:1,background:`linear-gradient(90deg,transparent,${rank.border},transparent)`,margin:'0 20px 16px'}}/>

                {/* 總結數據 */}
                <div style={{display:'flex',justifyContent:'center',gap:24,marginBottom:18}}>
                  <div style={{textAlign:'center'}}>
                    <div style={{fontSize:'1.8rem',fontWeight:900,color:rank.color1}}>36</div>
                    <div style={{fontSize:'.72rem',color:'#9a7a5a',fontWeight:600,letterSpacing:'.05em'}}>題總數</div>
                  </div>
                  <div style={{width:1,background:`${rank.border}88`}}/>
                  <div style={{textAlign:'center'}}>
                    <div style={{fontSize:'1.8rem',fontWeight:900,color:'#16a34a'}}>{36-wrongCount < 0 ? 0 : 36-wrongCount}</div>
                    <div style={{fontSize:'.72rem',color:'#9a7a5a',fontWeight:600,letterSpacing:'.05em'}}>答對次數</div>
                  </div>
                  <div style={{width:1,background:`${rank.border}88`}}/>
                  <div style={{textAlign:'center'}}>
                    <div style={{fontSize:'1.8rem',fontWeight:900,color:'#c0392b'}}>{wrongCount}</div>
                    <div style={{fontSize:'.72rem',color:'#9a7a5a',fontWeight:600,letterSpacing:'.05em'}}>答錯次數</div>
                  </div>
                </div>

                {/* 愛心列 */}
                <div style={{display:'flex',justifyContent:'center',gap:7,marginBottom:22}}>
                  {[...Array(6)].map((_,i)=>(
                    <div key={i} className="anim-heart-pop" style={{animationDelay:`${i*.09}s`}}>
                      <Heart style={{width:24,height:24,color:'#c0392b'}} filled/>
                    </div>
                  ))}
                </div>

                {/* 恭喜文字 */}
                <h1 style={{fontSize:'1.6rem',fontWeight:900,color:'#1a1208',margin:'0 0 6px',letterSpacing:'.05em'}}>恭喜通關！🎉</h1>
                <p className="shimmer-text" style={{fontWeight:800,fontSize:'.95rem',margin:'0 0 22px'}}>
                  你現在是名副其實的「{rank.title}」！
                </p>

                <button onClick={goToPreVideo}
                  onMouseEnter={e=>e.currentTarget.style.transform='translateY(-2px)'}
                  onMouseLeave={e=>e.currentTarget.style.transform='translateY(0)'}
                  style={{width:'100%',padding:'14px',background:`linear-gradient(135deg,${rank.color1},${rank.color2})`,color:'white',border:'none',borderRadius:12,cursor:'pointer',fontFamily:"'Noto Serif TC',serif",fontWeight:700,fontSize:'.98rem',letterSpacing:'.06em',boxShadow:`0 6px 20px ${rank.glow}`,transition:'all .2s'}}>
                  🏠 回到遊戲開始
                </button>
                <p style={{marginTop:14,fontSize:'.95rem',color:'#ffffff',fontWeight:800,letterSpacing:'.15em',textShadow:'0 1px 8px rgba(0,0,0,.55)'}}>南一書局 × 林威宇老師 製作</p>
              </div>
            </div>
          </div>
        );
      })()}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
